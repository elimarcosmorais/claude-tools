version: '3'

tasks:
  build:
    desc: Compila bin/claude-tools.exe
    cmds:
      - go build -o bin/claude-tools.exe ./cmd/claude-tools

  test:
    desc: Roda os testes
    cmds:
      - go test ./...

  lint:
    desc: Roda o go vet e falha se algum arquivo estiver fora do gofmt
    cmds:
      - go vet ./...
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "Arquivos fora do gofmt (rode 'gofmt -w .'):"
          echo "$unformatted"
          exit 1
        fi

  install:
    desc: 'Instala o claude-tools.exe na pasta informada e o põe no PATH do usuário (go tool task install DIR=<pasta>)'
    # A pasta vem na variável DIR: o Task recusa flag que não é dele (--path) e lê
    # argumento solto como nome de tarefa. A conferência vem antes do build: deps
    # rodariam antes das preconditions. O default "" é porque, sem DIR, o shellQuote
    # recebe nil e o Task quebra ao montar os templates, antes da precondition.
    preconditions:
      - sh: test -n {{shellQuote (default "" .DIR)}}
        msg: 'Informe a pasta de instalação: go tool task install DIR=<pasta>  (ex.: go tool task install DIR=C:\dev\programs\claude-tools)'
    cmds:
      - task: build
      - pwsh -NoProfile -File scripts/install.ps1 -Root {{shellQuote (default "" .DIR)}} {{.CLI_ARGS}}
